name: Build APK
on:
  push:
    branches-ignore: [main]
    paths-ignore: ['release/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unit tests (pure logic)
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Commit APK back to branch
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Ogen.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Ogen.apk
          git commit -m "Build APK for ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
